name: Docker

# Builds the image on the newest rclone release, smoke-tests it, then publishes it to GHCR (not for pull requests).
# - push to master or a v*.*.* tag: build and publish
# - every Monday: publish only when rclone has a release that is not published yet
# - pull request: build and test only

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the keyless cosign signature (sigstore/fulcio).
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the newest rclone release
        id: rclone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/rclone/rclone/releases/latest --jq .tag_name)
          version=${version#v}
          echo "Newest rclone: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip the weekly build when this rclone version is already published
        id: published
        if: github.event_name == 'schedule'
        env:
          VERSION: ${{ steps.rclone.outputs.version }}
        run: |
          if docker manifest inspect "$REGISTRY/$IMAGE_NAME:rclone-$VERSION" >/dev/null 2>&1; then
            echo "rclone $VERSION is already published; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.published.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.published.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image for the smoke test
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: docker-rclone:test
          platforms: linux/amd64
          build-args: RCLONE_VERSION=${{ steps.rclone.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.published.outputs.skip != 'true'
        run: bash tests/smoke.sh docker-rclone:test

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.published.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest and rclone-<version> on master (push, schedule, manual run); the semver tags on a v*.*.* tag.
      # The version label is the rclone version, so the Docker Updates dashboard shows "1.75.2 → 1.76.0".
      - name: Extract Docker metadata
        if: steps.published.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=rclone-${{ steps.rclone.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.version=${{ steps.rclone.outputs.version }}

      - name: Build and push Docker image
        if: steps.published.outputs.skip != 'true'
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RCLONE_VERSION=${{ steps.rclone.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Install cosign
        if: steps.published.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless signature of the pushed digest; public repositories write it to the public Rekor log.
      - name: Sign the published Docker image
        if: steps.published.outputs.skip != 'true' && github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
